name: Publish Package

on:
  release:
    types: [published]

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # No `version:` — the pnpm version comes from package.json's
      # `packageManager` field, so CI and local dev cannot drift apart.
      # action-setup v4+ errors if both are set and disagree.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Validate.yml runs on pull_request only, and releases are cut from direct
      # pushes to main, so this is the final authoritative release gate
      - run: pnpm typecheck
      - run: pnpm test

      # package.json ships a 0.0.0 placeholder — the release tag is the source
      # of truth. Stamp after install so --frozen-lockfile sees the committed
      # manifest, and before publish so the tarball carries the real version.
      - name: Stamp version from release tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="${TAG#v}"
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Tag '$TAG' is not vMAJOR.MINOR.PATCH — refusing to publish"
            exit 1
          fi
          npm pkg set version="$VERSION"   # pnpm has no `pkg` command
          echo "Publishing version $VERSION"

      # Auth is npm trusted publishing over OIDC (see `id-token: write` above) —
      # no NPM_TOKEN secret involved.
      - run: pnpm publish --no-git-checks --provenance
