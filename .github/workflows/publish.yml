name: Publish Package

on:
  release:
    types: [published]

permissions:
  id-token: write
  contents: read

# Serialize, so two releases cut minutes apart cannot race each other
concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # No `version:` — the pin lives in package.json's `packageManager`
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck
      - run: pnpm test

      # package.json ships a 0.0.0 placeholder — the release tag is the source
      # of truth, so the tarball only gets a real version from this step
      - name: Stamp version from release tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="${TAG#v}"
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Tag '$TAG' is not vMAJOR.MINOR.PATCH — refusing to publish"
            exit 1
          fi
          npm pkg set version="$VERSION"   # pnpm has no `pkg` command
          echo "Publishing version $VERSION"

      # Auth is npm trusted publishing over OIDC (`id-token: write` above)
      - run: pnpm publish --no-git-checks --provenance
